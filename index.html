<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GTD 集中タイマー</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f2f5ed;background:#081b15}
    *{box-sizing:border-box}
    body{margin:0;padding:12px}
    .app{max-width:520px;margin:auto;background:#122b23;padding:16px;border-radius:16px}
    header{display:flex;align-items:center;justify-content:space-between;gap:10px}
    h1{font-size:18px;margin:0} p{margin:8px 0;color:#b8c8bd}
    label{display:block;margin:10px 0 5px;font-weight:700;font-size:13px}
    select,input,textarea{width:100%;background:#081b15;border:1px solid #61776b;color:#fff;padding:10px;border-radius:8px;font:inherit}
    textarea{min-height:64px;resize:vertical}
    .task-row{display:flex;gap:7px;align-items:end}.task-row>div{flex:1}
    button{background:#b9ef72;color:#102015;border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer;white-space:nowrap}
    button.secondary{background:#365247;color:#f2f5ed}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:14px 0 8px}
    button:disabled{opacity:.4;cursor:default}.compact{margin-top:12px}
    #clock{text-align:center;font-size:clamp(48px,16vw,76px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;margin:16px 0 2px}
    #state{text-align:center;color:#b9ef72;font-size:13px}.hint{font-size:12px;line-height:1.5}
    details{border-top:1px solid #365247;margin-top:12px;padding-top:10px}summary{cursor:pointer;font-weight:700;font-size:13px}
    #notice{min-height:1.4em;color:#b9ef72;font-size:12px}.history-wrap{overflow:auto;max-height:180px}
    table{width:100%;font-size:12px;border-collapse:collapse}td,th{border-bottom:1px solid #365247;text-align:left;padding:6px 4px;white-space:nowrap}
    .status{font-size:12px;color:#b8c8bd}.hidden{display:none}
  </style>
</head>
<body>
<main class="app">
  <header><h1>⏱ GTD 集中タイマー</h1><span class="status" id="apiState">ローカル保存</span></header>
  <div class="compact">
    <label for="taskSelect">取り組むタスク</label>
    <div class="task-row"><div><select id="taskSelect"><option value="">手入力またはタスクを読み込む</option></select></div><button class="secondary" id="loadTasks" type="button">読み込む</button></div>
    <div id="clock">00:00:00</div><div id="state">待機中</div>
    <div class="buttons"><button id="start">▶ 開始</button><button id="pause">Ⅱ 中断</button><button id="resume">↻ 再開</button><button id="finish">✓ 記録</button><button class="secondary" id="reset">リセット</button></div>
  </div>
  <p id="notice" role="status"></p>
  <details>
    <summary>タスク詳細・再開メモ</summary>
    <label for="task">タスク名（手入力）</label><input id="task" maxlength="160" placeholder="例：レンズ磨き">
    <label for="next">次の一手・再開メモ</label><textarea id="next" placeholder="例：次は前玉の状態を確認"></textarea>
    <label for="link">関連タスクURL（任意）</label><input id="link" type="url" placeholder="https://www.notion.so/...">
  </details>
  <details>
    <summary>Notion連携設定</summary>
    <p class="hint">Worker URLだけを設定します。Notionトークンや保存キーはこのページに入力・保存しません。Cloudflare Access等の認証設定が完了するまで、記録はローカルに残ります。</p>
    <label for="api">Worker URL（例：workers.devのベースURL）</label><input id="api" type="url" placeholder="https://your-worker.workers.dev">
  </details>
  <details>
    <summary>作業履歴</summary>
    <button class="secondary" id="csv" type="button">CSVを書き出す</button>
    <div class="history-wrap"><table><thead><tr><th>終了日時</th><th>タスク</th><th>時間</th><th>再開メモ</th></tr></thead><tbody id="history"></tbody></table></div>
  </details>
</main>
<script>
(()=>{'use strict';
const K='gtd-timer-v2',H='gtd-timer-history-v2',API='gtd-timer-api-v1',$=id=>document.getElementById(id),now=()=>Date.now();
let s;try{s=JSON.parse(localStorage.getItem(K))}catch{};s=s&&typeof s==='object'?s:{mode:'idle',elapsed:0,startedAt:null,task:'',taskId:'',next:'',link:''};
if(!['idle','running','paused'].includes(s.mode))s.mode='idle';if(!Number.isFinite(s.elapsed)||s.elapsed<0)s.elapsed=0;
if(s.mode==='running'&&!Number.isFinite(s.startedAt))s.mode='paused';let hist=[];try{let x=JSON.parse(localStorage.getItem(H));if(Array.isArray(x))hist=x}catch{};
$('task').value=s.task||'';$('next').value=s.next||'';$('link').value=s.link||'';$('api').value=localStorage.getItem(API)||'';
function save(){s.task=$('task').value;s.next=$('next').value;s.link=$('link').value;localStorage.setItem(K,JSON.stringify(s));localStorage.setItem(API,$('api').value.trim())}
function seconds(){return Math.floor((s.elapsed+(s.mode==='running'?Math.max(0,now()-s.startedAt):0))/1000)}
function fmt(t){return [Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(n=>String(n).padStart(2,'0')).join(':')}
function render(){$('clock').textContent=fmt(seconds());$('state').textContent=s.mode==='running'?'集中中':s.mode==='paused'?'中断中':'待機中';$('start').disabled=s.mode!=='idle';$('pause').disabled=s.mode!=='running';$('resume').disabled=s.mode!=='paused';$('finish').disabled=s.mode==='idle';$('apiState').textContent=$('api').value.trim()?'Worker設定済み':'ローカル保存'}
function history(){const tb=$('history');tb.replaceChildren();hist.slice(-20).reverse().forEach(x=>{let tr=document.createElement('tr');[x.end,x.task,fmt(x.seconds),x.next].forEach(v=>{let td=document.createElement('td');td.textContent=v||'';tr.append(td)});tb.append(tr)})}
function note(v){$('notice').textContent=v}
function selectTask(){const o=$('taskSelect').selectedOptions[0];if(!o||!o.value)return; s.task=o.dataset.title||o.textContent;s.taskId=o.value;s.link=o.dataset.url||'';$('task').value=s.task;$('link').value=s.link;save();note('Task DBのタスクを選択しました')}
async function loadTasks(){const base=$('api').value.trim().replace(/\/$/,'');if(!base){note('Worker URLを設定してください');return}note('Task DBを読み込み中…');try{const r=await fetch(base+'/tasks',{credentials:'include',headers:{Accept:'application/json'}});if(!r.ok)throw new Error(String(r.status));const data=await r.json();$('taskSelect').replaceChildren(new Option('手入力またはタスクを読み込む',''));(data.tasks||[]).forEach(x=>{const o=new Option(x.title,x.id);o.dataset.title=x.title;o.dataset.url=x.url||'';$('taskSelect').append(o)});$('apiState').textContent='Task DB接続済み';note(`${(data.tasks||[]).length}件読み込みました`)}catch(e){note('Task DBを読み込めません。Workerのデプロイ・認証設定を確認してください')}}
async function sendLog(end,secs){const base=$('api').value.trim().replace(/\/$/,'');if(!base||!s.taskId)return false;const r=await fetch(base+'/log',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({taskId:s.taskId,task:s.task,start:new Date(end-secs*1000).toISOString(),end:new Date(end).toISOString(),minutes:Math.round(secs/60*100)/100,note:s.next,taskUrl:s.link})});if(!r.ok)throw new Error(String(r.status));return true}
['task','next','link','api'].forEach(id=>$(id).addEventListener('input',()=>{save();render()}));$('taskSelect').addEventListener('change',selectTask);$('loadTasks').onclick=loadTasks;
$('start').onclick=()=>{if(!$('task').value.trim()){note('タスク名を入力またはTask DBから選択してください');return}s.mode='running';s.startedAt=now();s.elapsed=0;save();render();note('開始しました')};
$('pause').onclick=()=>{s.elapsed+=Math.max(0,now()-s.startedAt);s.startedAt=null;s.mode='paused';save();render();note('中断しました')};$('resume').onclick=()=>{s.startedAt=now();s.mode='running';save();render();note('再開しました')};
$('finish').onclick=async()=>{if(!confirm('作業時間を保存しますか？'))return;const end=now(),secs=seconds();const item={end:new Date(end).toLocaleString('ja-JP'),iso:new Date(end).toISOString(),task:$('task').value.trim(),seconds:secs,next:$('next').value.trim(),link:$('link').value.trim()};hist.push(item);localStorage.setItem(H,JSON.stringify(hist));let synced=false;try{synced=await sendLog(end,secs)}catch{};s={mode:'idle',elapsed:0,startedAt:null,task:'',taskId:'',next:'',link:''};$('task').value='';$('next').value='';$('link').value='';$('taskSelect').value='';save();render();history();note(synced?'ローカル保存＋Task DBへ記録しました':'ローカルに保存しました（Task DB連携は未完了）')};
$('reset').onclick=()=>{if(!confirm('現在の計測を破棄しますか？'))return;s.mode='idle';s.elapsed=0;s.startedAt=null;save();render();note('リセットしました')};
$('csv').onclick=()=>{if(!hist.length){note('履歴がありません');return}const esc=x=>'"'+String(x??'').replaceAll('"','""')+'"';const rows=[['作業名','開始日時','終了日時','作業時間（分）','再開メモ','関連タスクURL'],...hist.map(x=>[x.task,new Date(new Date(x.iso).getTime()-x.seconds*1000).toISOString(),x.iso,Math.round(x.seconds/60*100)/100,x.next,x.link||''])];const url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(esc).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='gtd-work-log.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);note('履歴をCSVに書き出しました')};render();history();setInterval(render,250)
})();
</script>
</body>
</html>
