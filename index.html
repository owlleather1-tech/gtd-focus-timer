<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTD 集中タイマー</title><style>:root{font-family:system-ui;color:#f2f5ed;background:#081b15}body{margin:0;padding:16px}.app{max-width:680px;margin:auto;background:#122b23;padding:24px;border-radius:18px}h1{font-size:24px}label{display:block;margin:14px 0 6px;font-weight:700}input,textarea{box-sizing:border-box;width:100%;background:#081b15;border:1px solid #61776b;color:white;padding:12px;border-radius:8px;font:inherit}textarea{min-height:72px}#clock{text-align:center;font-size:clamp(44px,12vw,70px);font-weight:800;font-variant-numeric:tabular-nums;margin-top:18px}#state{text-align:center;color:#b8c8bd}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:22px 0}button{background:#b9ef72;border:0;border-radius:9px;padding:12px 16px;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:default}.hint{font-size:13px;color:#b8c8bd;line-height:1.6}table{width:100%;font-size:13px;border-collapse:collapse}td,th{border-bottom:1px solid #365247;text-align:left;padding:8px 4px}#notice{min-height:1.5em;color:#b9ef72}</style><main class="app"><h1>⏱ GTD 集中タイマー</h1><p>まず5分。中断しても再開できます。</p><label for="task">取り組むタスク</label><input id="task" maxlength="160" placeholder="例：レンズ磨き"><label for="next">次の一手・再開メモ</label><textarea id="next" placeholder="例：次は前玉の状態を確認"></textarea><div id="clock">00:00:00</div><div id="state">待機中</div><div class="buttons"><button id="start">▶ 開始</button><button id="pause">Ⅱ 中断</button><button id="resume">↻ 再開</button><button id="finish">✓ 完了して記録</button><button id="reset">リセット</button></div><p class="hint">作業履歴はこのブラウザーのみに保存します。Notionへの自動送信や別端末との同期はありません。プライベートブラウズやブラウザーデータ削除で履歴が消えることがあります。</p><h2>作業履歴</h2><button id="csv">CSVを書き出す</button><p id="notice" role="status"></p><div style="overflow-x:auto"><table><thead><tr><th>終了日時</th><th>タスク</th><th>時間</th><th>再開メモ</th></tr></thead><tbody id="history"></tbody></table></div></main><script>(()=>{'use strict';const K='gtd-timer-v1',H='gtd-timer-history-v1',$=id=>document.getElementById(id),now=()=>Date.now();let s;try{s=JSON.parse(localStorage.getItem(K))}catch{}s=s&&typeof s==='object'?s:{mode:'idle',elapsed:0,startedAt:null,task:'',next:''};if(!['idle','running','paused'].includes(s.mode))s.mode='idle';if(!Number.isFinite(s.elapsed)||s.elapsed<0)s.elapsed=0;if(s.mode==='running'&&!Number.isFinite(s.startedAt))s.mode='paused';let hist=[];try{let x=JSON.parse(localStorage.getItem(H));if(Array.isArray(x))hist=x}catch{}$('task').value=s.task||'';$('next').value=s.next||'';function save(){s.task=$('task').value;s.next=$('next').value;localStorage.setItem(K,JSON.stringify(s))}function seconds(){return Math.floor((s.elapsed+(s.mode==='running'?Math.max(0,now()-s.startedAt):0))/1000)}function fmt(t){return [Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(n=>String(n).padStart(2,'0')).join(':')}function render(){$('clock').textContent=fmt(seconds());$('state').textContent=s.mode==='running'?'集中中':s.mode==='paused'?'中断中':'待機中';$('start').disabled=s.mode!=='idle';$('pause').disabled=s.mode!=='running';$('resume').disabled=s.mode!=='paused';$('finish').disabled=s.mode==='idle'}function history(){const tb=$('history');tb.replaceChildren();hist.slice(-20).reverse().forEach(x=>{let tr=document.createElement('tr');[x.end,x.task,fmt(x.seconds),x.next].forEach(v=>{let td=document.createElement('td');td.textContent=v||'';tr.append(td)});tb.append(tr)})}function note(v){$('notice').textContent=v}['task','next'].forEach(id=>$(id).addEventListener('input',save));$('start').onclick=()=>{s.mode='running';s.startedAt=now();s.elapsed=0;save();render();note('開始しました')};$('pause').onclick=()=>{s.elapsed+=Math.max(0,now()-s.startedAt);s.startedAt=null;s.mode='paused';save();render();note('中断しました')};$('resume').onclick=()=>{s.startedAt=now();s.mode='running';save();render();note('再開しました')};$('finish').onclick=()=>{if(!confirm('作業を完了して履歴に保存しますか？'))return;hist.push({end:new Date().toLocaleString('ja-JP'),iso:new Date().toISOString(),task:$('task').value.trim(),seconds:seconds(),next:$('next').value.trim()});localStorage.setItem(H,JSON.stringify(hist));s={mode:'idle',elapsed:0,startedAt:null,task:'',next:''};$('task').value='';$('next').value='';save();render();history();note('履歴に保存しました')};$('reset').onclick=()=>{if(!confirm('現在の計測を破棄しますか？'))return;s.mode='idle';s.elapsed=0;s.startedAt=null;save();render();note('リセットしました')};$('csv').onclick=()=>{if(!hist.length){note('履歴がありません');return}const esc=x=>'"'+String(x??'').replaceAll('"','""')+'"';const rows=[['終了日時','ISO日時','タスク','作業時間（秒）','再開メモ'],...hist.map(x=>[x.end,x.iso,x.task,x.seconds,x.next])];const url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(esc).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='gtd-work-log.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);note('CSVを書き出しました')};render();history();setInterval(render,250)})();</script></html>
