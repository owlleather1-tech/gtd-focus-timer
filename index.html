<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTD ミニタイマー</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f2f5ed;background:#122b23}*{box-sizing:border-box}body{margin:0;padding:8px}.timer{max-width:460px;margin:auto;border-radius:12px;padding:10px 12px;background:#122b23}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:14px;margin:0;font-weight:650}#clock{font-size:clamp(32px,9vw,45px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}#state{font-size:11px;color:#b9ef72}.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}button{background:#b9ef72;color:#102015;border:0;border-radius:7px;padding:9px 12px;font:600 13px system-ui;cursor:pointer;min-height:38px}button.secondary{background:#365247;color:#f2f5ed}button:disabled{opacity:.35;cursor:default}#notice{font-size:12px;min-height:1.2em;margin:6px 0 0;color:#b9ef72}#result{display:none;background:#081b15;border-radius:8px;padding:9px;margin-top:8px;align-items:center;justify-content:space-between;gap:8px}#result strong{font-size:20px}details{margin-top:8px;border-top:1px solid #365247;padding-top:8px}summary{font-size:12px;color:#b8c8bd;cursor:pointer}small{color:#b8c8bd}label{display:block;font-size:12px;margin:8px 0 4px}input{background:#081b15;border:1px solid #61776b;border-radius:6px;color:#fff;padding:8px;width:100%;font:inherit}
</style></head><body><main class="timer"><header><h1>⏱ 集中タイマー</h1><span id="state">待機中</span></header><div id="clock">00:00:00</div><div class="actions"><button id="start">▶ 開始</button><button id="pause" class="secondary">Ⅱ 中断</button><button id="resume" class="secondary">↻ 再開</button><button id="finish">✓ 完了</button><button id="reset" class="secondary">リセット</button></div><div id="result"><div><small>今回の実績時間（分）</small><br><strong id="minutes">0</strong></div><button id="copy">コピー</button></div><p id="notice" role="status"></p><details><summary>タスク名・記録の説明</summary><label for="task">作業タスク（任意）</label><input id="task" placeholder="例：レンズ磨き" maxlength="150"><p><small>「完了」で実績時間（分）を表示します。コピーしてNotionの新GTD Task DBの「実績時間（分）」に貼り付けてください。自動連携・認証キー入力はありません。</small></p></details></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='gtd-mini-timer-v1';let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s||!['idle','running','paused'].includes(s.mode))s={mode:'idle',elapsed:0,startedAt:null,task:'',lastMinutes:null};if(!Number.isFinite(s.elapsed)||s.elapsed<0)s.elapsed=0;if(s.mode==='running'&&!Number.isFinite(s.startedAt))s.mode='paused';$('task').value=s.task||'';
function save(){s.task=$('task').value;try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function elapsed(){return s.elapsed+(s.mode==='running'?Math.max(0,Date.now()-s.startedAt):0)}
function fmt(sec){return [Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(n=>String(n).padStart(2,'0')).join(':')}
function notice(t){$('notice').textContent=t}
function render(){const idle=s.mode==='idle';$('clock').textContent=fmt(Math.floor(elapsed()/1000));$('state').textContent=idle?'待機中':s.mode==='running'?'計測中':'中断中';$('start').disabled=!idle;$('pause').disabled=s.mode!=='running';$('resume').disabled=s.mode!=='paused';$('finish').disabled=idle;if(s.lastMinutes!==null&&Number.isFinite(s.lastMinutes)){$('result').style.display='flex';$('minutes').textContent=s.lastMinutes}else $('result').style.display='none'}
$('task').oninput=save;$('start').onclick=()=>{s.mode='running';s.startedAt=Date.now();s.elapsed=0;s.lastMinutes=null;save();render();notice('計測を開始しました')};$('pause').onclick=()=>{s.elapsed=elapsed();s.startedAt=null;s.mode='paused';save();render();notice('中断しました')};$('resume').onclick=()=>{s.startedAt=Date.now();s.mode='running';save();render();notice('再開しました')};$('finish').onclick=()=>{if(!confirm('計測を完了しますか？'))return;const ms=elapsed();s.lastMinutes=+(ms/60000).toFixed(2);s.mode='idle';s.elapsed=0;s.startedAt=null;save();render();notice('実績時間をコピーしてNotionに貼り付けてください')};$('reset').onclick=()=>{if(!confirm('現在の計測を破棄しますか？'))return;s.mode='idle';s.elapsed=0;s.startedAt=null;s.lastMinutes=null;save();render();notice('リセットしました')};$('copy').onclick=async()=>{const value=String(s.lastMinutes);try{await navigator.clipboard.writeText(value);notice(value+' 分をコピーしました')}catch{const t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();try{document.execCommand('copy');notice(value+' 分をコピーしました')}catch{notice('コピーできません。数字を手動でコピーしてください')}t.remove()}};render();setInterval(render,300)})();
</script></body></html>
